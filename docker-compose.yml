services:
  app:
    container_name: glb-watch
    image: ghcr.io/nkvtd/glb-watch:latest
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://glb-server:8080/api}
      - PUBLIC_ENV__API_URL=${PUBLIC_ENV__API_URL:-https://glb.nkvtd.com/api}
    networks:
      - default
      - edge-proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped

networks:
  edge-proxy:
    external: true